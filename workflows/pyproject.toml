[project]
name = "chp99-workflows"
version = "0.1.0"
description = "Hatchet workflows for the Chapter 99 take-home"
requires-python = ">=3.11"
dependencies = [
    "hatchet-sdk>=1.37.0,<2",
    "httpx>=0.27",
    "pypdf>=4.0",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
# Add whatever you need — an HTTP client, a PDF parser, a Postgres driver.
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
